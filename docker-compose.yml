services:
  postgres:
    image: postgres:16
    container_name: attendance_postgres
    environment:
      POSTGRES_USER: rishal_user
      POSTGRES_PASSWORD: 12345678
      POSTGRES_DB: rishal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rishal_user -d rishal_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: attendance_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://rishal_user:12345678@postgres:5432/rishal_db
      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      CORS_ORIGINS: http://localhost,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: attendance_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
