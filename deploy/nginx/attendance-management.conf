# Install as /etc/nginx/sites-available/attendance-management.conf and enable it.
# The build is deployed to /var/www so Nginx workers can read it even when the
# source repository is inside a user's home directory.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /var/www/attendance-management;
    index index.html;

    # FastAPI owns API and uploaded-profile-image requests.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fall back to the SPA entry point for direct links and browser refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
